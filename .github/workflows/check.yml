name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: kinexport
    container:
      image: node:24-alpine
    steps:
      - name: Install test dependencies
        run: apk add --no-cache git bash imagemagick imagemagick-jpeg imagemagick-webp
      - uses: actions/checkout@v4
      - name: Check project and tests
        run: |
          npm ci --prefix server
          npm run check
