name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: node24-debian-13
    container:
      image: node:24-trixie
    steps:
      - name: Verify container socket is unavailable
        run: |
          test ! -S /var/run/docker.sock
          test ! -S /run/podman/podman.sock
          test -z "${DOCKER_HOST:-}"
      - name: Install test dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git imagemagick
      - uses: actions/checkout@v4
      - name: Check project and tests
        run: |
          npm ci --prefix server
          npm run check
