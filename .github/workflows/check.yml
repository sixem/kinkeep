name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    container:
      image: node:24-trixie
    steps:
      - name: Install test dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git imagemagick
      - uses: actions/checkout@v4
      - name: Check project and tests
        run: |
          npm ci --prefix server --ignore-scripts
          npm run check
