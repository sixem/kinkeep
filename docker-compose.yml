name: kinexport-local
services:
  archive:
    build: ./server
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,mode=1777
    labels:
      io.kinexport.managed: "true"
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      KINEXPORT_TOKEN: "${KINEXPORT_TOKEN:?Run ./setup.sh start to create a local token}"
      HOST: "0.0.0.0"
      PORT: "8765"
      DATABASE_PATH: /data/kinexport.sqlite
    volumes:
      - archive-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8765/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  archive-data:
